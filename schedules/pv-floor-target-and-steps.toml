# Taken over from a run held at the floor with 74 at +0.1: 88 stepped with 74
# held, then 74 stepped up, to learn what the speed control aims at.
round = 10
watch = [74, 88, 4108, 1008, 1066, 1070, 1090, 1091, 1100, 1074, 4122, 1004, 1098]

[final]
surplus = -0.5
target = 0.0
limit = -1.0

[[phase]]
surplus = 0.1
target = -1.0
for = 240

[[phase]]
surplus = 0.1
target = 0.0
for = 240

[[phase]]
surplus = 0.3
target = 0.0
for = 240

[[phase]]
surplus = 0.5
target = 0.0
for = 240

[[phase]]
surplus = 0.1
target = 0.0
until = "stop"
